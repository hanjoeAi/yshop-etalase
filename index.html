<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etalase — Link Belanja Shopee</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div class="brand-name">Etalase</div>
    </div>
    <div class="topbar-actions">
      <button class="btn-pill" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        Bagikan etalase
      </button>
    </div>
  </div>

  <div class="hero">
    <div class="eyebrow-chip"><span class="dot"></span>Etalase produk pilihan</div>
    <h1 class="headline">Satu rak berisi <span class="accent-word">semua link Shopee</span> pilihanku.</h1>
    <p class="sub">Klik produk yang kamu suka untuk langsung membelinya di Shopee.</p>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Kategori</div>
      <nav class="cat-list" id="cat-list"></nav>
    </aside>

    <div class="main-content">
      <div class="list-header">
        <h2>Produk di etalase</h2>
        <span class="count-tag" id="count-tag">memuat…</span>
      </div>

      <div id="list-area">
        <div class="empty">
          <strong>Memuat etalase…</strong>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span>Etalase ini diperbarui secara berkala.</span>
  </footer>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="app.js"></script>
</body>
</html>
